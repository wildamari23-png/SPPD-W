<script>
let cache={};
const esc=s=>String(s??'-');
function toast(msg,type='ok'){const el=document.createElement('div');el.className='card';el.style.position='fixed';el.style.right='10px';el.style.bottom='10px';el.style.zIndex=9999;el.innerHTML=`<b>${type.toUpperCase()}</b><div>${msg}</div>`;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
function togglePw(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'}
function doLogin(){google.script.run.withSuccessHandler(r=>{if(r.ok){toast(r.message);document.getElementById('loginCard').classList.add('hidden');document.getElementById('main').classList.remove('hidden');loadInitial()}else toast(r.message,'error')}).login(username.value,password.value)}
function doLogout(){google.script.run.withSuccessHandler(()=>location.reload()).logout()}
function loadInitial(){google.script.run.withSuccessHandler(d=>{cache=d;renderStats(d.dashboard);openTab('pegawai')}).getInitialData()}
function renderStats(d){stats.innerHTML=`<div class='stat'>Pegawai<br><b>${d.totalPegawai}</b></div><div class='stat'>SPT<br><b>${d.totalSPT}</b></div><div class='stat'>SPPD<br><b>${d.totalSPPD}</b></div><div class='stat'>Aktif<br><b>${d.perjalananAktif}</b></div>`}
function openTab(tab){const c=document.getElementById('tabContent'); if(tab==='pegawai') c.innerHTML=pegawaiTab(); if(tab==='spt') c.innerHTML=sptTab(); if(tab==='sppd') c.innerHTML=sppdTab(); if(tab==='laporan') c.innerHTML=laporanTab(); if(tab==='kwitansi') c.innerHTML=kwitansiTab(); if(tab==='monitoring') c.innerHTML=monitoringTab(); if(tab==='setting') c.innerHTML=settingTab();}
function pegawaiTab(){return `<div class='card'><h3>Database Pegawai</h3><input id='qPegawai' placeholder='Cari...' oninput='searchPegawai()'><div class='table'><table><thead><tr><th>ID</th><th>Nama</th><th>Status</th><th>Jabatan</th></tr></thead><tbody id='pegawaiRows'>${(cache.pegawai||[]).map(p=>`<tr><td>${esc(p.id_qr)}</td><td>${esc(p.nama)}</td><td>${esc(p.status)}</td><td>${esc(p.jabatan)}</td></tr>`).join('')}</tbody></table></div></div>`}
function searchPegawai(){google.script.run.withSuccessHandler(rows=>pegawaiRows.innerHTML=rows.map(p=>`<tr><td>${esc(p.id_qr)}</td><td>${esc(p.nama)}</td><td>${esc(p.status)}</td><td>${esc(p.jabatan)}</td></tr>`).join('')).searchPegawai(qPegawai.value,'')}
function sptTab(){return `<div class='card'><h3>Modul SPT</h3><input id='nomor_spt' placeholder='Nomor SPT (opsional auto)'><input type='date' id='tanggal'><textarea id='dasar' placeholder='Dasar'></textarea><textarea id='maksud' placeholder='Maksud'></textarea><input id='tujuan' placeholder='Tujuan'><input type='date' id='berangkat'><input type='date' id='kembali'><button onclick='submitSPT()'>Simpan SPT</button></div>`}
function submitSPT(){const payload={nomor_spt:nomor_spt.value,tanggal:tanggal.value,dasar:dasar.value,maksud:maksud.value,tujuan:tujuan.value,tanggal_berangkat:berangkat.value,tanggal_kembali:kembali.value,pegawai_ids:[]};google.script.run.withSuccessHandler(r=>toast('SPT dibuat: '+r.nomor_spt)).saveSPT(payload)}
function sppdTab(){return `<div class='card'><h3>Modul SPPD</h3><input id='nomorSptRef' placeholder='Nomor SPT'><input id='pejabat' placeholder='Pejabat pemberi tugas'><input id='rute' placeholder='Rute'><button onclick='buatSPPD()'>Generate SPPD</button></div>`}
function buatSPPD(){google.script.run.withSuccessHandler(r=>toast('SPPD dibuat: '+r.nomor_sppd)).generateSPPDFromSPT(nomorSptRef.value,pejabat.value,rute.value)}
function laporanTab(){return `<div class='card'><h3>Laporan Perjalanan Dinas</h3><textarea id='hasil' placeholder='Hasil'></textarea><textarea id='kesimpulan' placeholder='Kesimpulan'></textarea><button onclick='simpanLaporan()'>Simpan Laporan</button></div>`}
function simpanLaporan(){google.script.run.withSuccessHandler(()=>toast('Laporan disimpan')).saveLaporan({hasil:hasil.value,kesimpulan:kesimpulan.value})}
function kwitansiTab(){return `<div class='card'><h3>Kwitansi</h3><input id='lama_hari' type='number' value='1'><button onclick='hitungBiaya()'>Hitung</button><div id='hasilBiaya'></div></div>`}
function hitungBiaya(){google.script.run.withSuccessHandler(r=>hasilBiaya.innerHTML=`Total: <b>Rp ${r.total.toLocaleString('id-ID')}</b><br>Terbilang: ${r.terbilang}`).hitungKwitansi({lama_hari:lama_hari.value})}
function monitoringTab(){return `<div class='card'><h3>Monitoring</h3><button onclick='loadMonitoring()'>Refresh</button><div id='monitorRows'></div></div>`}
function loadMonitoring(){google.script.run.withSuccessHandler(r=>{monitorRows.innerHTML=(r.rows||[]).map(x=>`<div>${esc(x.id_qr)} - ${esc(x.status_perjalanan)} ${Number(x.jumlah_perjalanan||0)>4?'<span class="badge warn">Sering Dinas</span>':''}</div>`).join('')||'-'}).getMonitoring({})}
function settingTab(){return `<div class='card'><h3>Pengaturan Logo</h3><input type='file' id='logoFile' accept='image/png,image/jpeg'><img id='logoPrev' src='${cache.settings?.logo||''}' style='max-height:70px;display:block;margin:8px 0'><button onclick='uploadLogo()'>Upload</button><button onclick='hapusLogo()'>Hapus</button></div>`}
function uploadLogo(){const f=logoFile.files[0];if(!f)return toast('Pilih file dulu','warn');const fr=new FileReader();fr.onload=e=>google.script.run.withSuccessHandler(r=>{logoPrev.src=r.url;toast('Logo tersimpan')}).saveLogo(e.target.result,f.type,f.name);fr.readAsDataURL(f)}
function hapusLogo(){google.script.run.withSuccessHandler(()=>{logoPrev.src='';toast('Logo dihapus')}).deleteLogo()}
</script>
